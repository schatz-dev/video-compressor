<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Compressor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Titlebar -->
    <header class="titlebar">
        <div class="titlebar-drag-region">
            <div class="app-brand">
                <svg class="app-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
                <span>Video Compressor</span>
            </div>
        </div>
    </header>

    <main class="app-container">

        <!-- Drop Zone -->
        <section class="section-card">
            <div class="drop-zone" id="dropZone">
                <input type="file" id="fileInput" class="file-input" accept="video/*">

                <div class="drop-zone-content" id="dropZoneContent">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <p class="drop-title">Drag & Drop video here or <span class="highlight">browse</span></p>
                </div>

                <div class="file-info hidden" id="fileInfo">
                    <div class="file-icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="23 7 16 12 23 17 23 7"></polygon>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                        </svg>
                    </div>
                    <div class="file-details">
                        <p class="file-name" id="fileName">video.mp4</p>
                        <div class="file-meta">
                            <span class="badge" id="fileSize">0 MB</span>
                        </div>
                    </div>
                    <button class="btn-icon" id="removeFileBtn" title="Remove File">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Controls -->
        <section class="section-card">
            <div class="control-header">
                <label for="targetSizeInput">Target Output Size</label>
                <span class="unit-badge">MB</span>
            </div>
            <div class="input-slider-row">
                <input type="range" class="slider" id="targetSizeSlider" min="1" max="100" value="10">
                <div class="number-input-wrapper">
                    <input type="number" id="targetSizeInput" min="1" max="500" value="10">
                    <span class="input-unit">MB</span>
                </div>
            </div>

            <div class="preset-pills">
                <button class="pill" data-size="8">8 MB (Discord)</button>
                <button class="pill active" data-size="10">10 MB</button>
                <button class="pill" data-size="25">25 MB (Email)</button>
                <button class="pill" data-size="50">50 MB</button>
            </div>
        </section>

        <!-- Action Button -->
        <div class="action-container">
            <button class="btn-primary" id="compressBtn" disabled>
                <svg viewBox="0 0 24 24">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Compress Video
            </button>
        </div>

        <!-- Status Card -->
        <section class="section-card" id="statusCard">
            <div class="status-header">
                <span class="status-title" id="statusTitle">Ready</span>
                <span class="status-percentage" id="statusPercentage">0%</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <p class="status-subtext" id="statusSubtext">Select a video file to begin compression.</p>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
